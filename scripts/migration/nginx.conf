map $http_upgrade $flowrix_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 81 default_server;
    listen [::]:81 default_server;
    server_name _;
    client_max_body_size 8m;
    location = /arrive.html {
        alias /var/www/flowrix-migration/arrive.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location ~* (^|/)(\.|inventory\.json|admin_db_key|DEPLOY\.txt|server\.(js|wasm)) {
        return 404;
    }
    location = /flowrix { return 302 /; }
    location = /flowrix/ { return 302 /; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $flowrix_connection_upgrade;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-cache" always;
    }
}
